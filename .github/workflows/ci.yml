name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify truth data and public-safety scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRUTH_SAFETY_PATTERNS: ${{ secrets.TRUTH_SAFETY_PATTERNS }}
        # The glossary-term check only warns for now. Drop --content-lint=warn
        # to make it blocking once the site rebuild has replaced the old pages.
        run: |
          node scripts/verify-truth.mjs --self-test
          node scripts/verify-truth.mjs --content-lint=warn

      - name: Build site
        run: pnpm build
