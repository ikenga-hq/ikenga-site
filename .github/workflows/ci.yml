name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      # WP-11: honest-inventory rule + public-safety and glossary lints.
      # Runs after the build so a lint failure never hides the build result. The self-test
      # proves each check still goes red on a seeded violation. GITHUB_TOKEN only raises the
      # API rate limit for the release-tag check.
      - name: Verify truth data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --disable-warning=ExperimentalWarning scripts/verify-truth.mjs --self-test
          node --disable-warning=ExperimentalWarning scripts/verify-truth.mjs
